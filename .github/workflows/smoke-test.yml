name: Smoke Test

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Integration Smoke Test (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.12.0, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Setup smoke test environment
        run: npm run smoke-test:setup

      - name: Run Smoke Test
        run: npm run smoke-test
        timeout-minutes: 2
