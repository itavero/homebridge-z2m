name: Verify

on:
  push:
    branches:
      - master
      - main
      - 'releases?/**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

  pull_request:
    types: [opened, assigned, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Verify
    runs-on: ubuntu-latest
    env:
      node-version-analysis: 24.x

    strategy:
      matrix:
        # the Node.js versions to build on
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Test
        run: npm run test

      - name: Archive reports (for PR analysis)
        if: github.event_name == 'pull_request' && matrix.node-version == env.node-version-analysis
        uses: actions/upload-artifact@v4
        with:
          name: reports
          retention-days: 7
          path: |
            coverage/lcov.info
            coverage/clover.xml
            reports/junit.xml

      - name: SonarCloud (on push)
        uses: sonarsource/sonarcloud-github-action@v2
        if: github.event_name == 'push' && matrix.node-version == env.node-version-analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Code Coverage (on push)
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && matrix.node-version == env.node-version-analysis
        with:
          files: ./coverage/clover.xml
          flags: tests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov Test Results (on push)
        uses: codecov/test-results-action@v1
        if: github.event_name == 'push' && matrix.node-version == env.node-version-analysis
        with:
          files: ./reports/junit.xml
          flags: tests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  analyze-pr:
    name: Analyze PR
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      run-analysis: ${{ secrets.SONAR_TOKEN != '' && secrets.CODECOV_TOKEN != '' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.number }}/merge

      - name: Download reports
        if: env.run-analysis == 'true'
        uses: actions/download-artifact@v5
        with:
          name: reports

      - name: Mark analysis as skipped (missing secrets)
        if: env.run-analysis != 'true'
        run: |
          echo "### Analyze PR skipped" >> $GITHUB_STEP_SUMMARY
          echo "SonarCloud/Codecov publishing was skipped because required secrets are unavailable for this run." >> $GITHUB_STEP_SUMMARY

      - name: Add comment to PR if analysis is skipped
        if: env.run-analysis != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: analyze
          number: ${{ github.event.number }}
          recreate: true
          message: |
            :warning: Skipped publishing SonarCloud/code coverage because required secrets are unavailable for this run.

      - name: SonarCloud
        if: env.run-analysis == 'true'
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.pullrequest.provider=github
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
            -Dsonar.pullrequest.github.token.secured=${{ secrets.GITHUB_TOKEN }}
            -Dsonar.pullrequest.key=${{ github.event.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

      - name: Publish Coverage to Codecov
        if: env.run-analysis == 'true'
        uses: codecov/codecov-action@v4
        with:
          override_pr: ${{ github.event.number }}
          override_commit: ${{ github.event.pull_request.head.sha }}
          files: ./coverage/clover.xml
          flags: tests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish Test Results to Codecov
        if: env.run-analysis == 'true'
        uses: codecov/test-results-action@v1
        with:
          override_pr: ${{ github.event.number }}
          override_commit: ${{ github.event.pull_request.head.sha }}
          files: ./reports/junit.xml
          flags: tests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Add comment to PR if job fails
        if: ${{ failure() && env.run-analysis == 'true' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: analyze
          number: ${{ github.event.number }}
          recreate: true
          message: |
            :x: Failed to run [SonarCloud and/or code coverage](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) step.

      - name: Add comment to PR if job succeeds
        if: ${{ success() && env.run-analysis == 'true' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: analyze
          number: ${{ github.event.number }}
          recreate: true
          message: |
            :ok: Published [SonarCloud and code coverage](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) data.
